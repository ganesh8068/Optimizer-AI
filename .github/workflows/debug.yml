name: Debug Build

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: List files
        run: ls -la

      - name: Check TypeScript version
        run: npx tsc --version

      - name: Run TypeScript compiler with verbose output
        run: npx tsc --noEmit --listFiles 2>&1 | head -50
        continue-on-error: true

      - name: Build with verbose output
        run: npm run build -- --logLevel debug
        env:
          VITE_OPENAI_API_KEY: test-key-for-ci
          DEBUG: "vite:*"
        continue-on-error: true

      - name: Show build errors
        if: failure()
        run: |
          echo "Build failed - checking dist directory"
          ls -la dist/ || echo "dist directory not created"
