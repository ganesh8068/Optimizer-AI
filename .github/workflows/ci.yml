name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 20.x
  VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY || 'test-key-for-ci' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript compiler check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
        env:
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY || 'test-key-for-ci' }}

      - name: Upload build artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 5

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Security scan summary
        run: echo "✅ Security scan completed (non-blocking)"

  build-and-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
        env:
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY || 'test-key-for-ci' }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/

      - name: List build output
        run: ls -la dist/ || echo "No dist directory"

      - name: Summary
        run: echo "✅ Build and deploy completed successfully"

  notify:
    needs: [lint-and-test, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check pipeline status
        run: |
          LINT_STATUS="${{ needs.lint-and-test.result }}"
          SECURITY_STATUS="${{ needs.security-scan.result }}"

          echo "Pipeline Status Report:"
          echo "====================="
          echo "Lint and Test: $LINT_STATUS"
          echo "Security Scan: $SECURITY_STATUS"
          echo ""

          if [ "$LINT_STATUS" = "failure" ]; then
            echo "❌ Pipeline FAILED: Lint and test check failed"
            exit 1
          fi

          echo "✅ Pipeline PASSED"
